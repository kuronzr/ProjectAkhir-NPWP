  <div class="form-container">
    <h2>Formulir Menemukan</h2>

    <form action="" method="">
      <label for="nama">Nama</label>
      <input type="text" name="nama" id="nama" placeholder="Masukkan nama Anda" required>

      <label for="kategori">Kategori</label>
      <select name="kategori" id="kategori" required>
        <option value="">Pilih Kategori</option>
        <option value="elektronik">Elektronik</option>
        <option value="pakaian">Pakaian</option>
        <option value="perhiasan">Perhiasan</option>
        <option value="lainnya">Lainnya</option>
      </select>

      <label for="deskripsi">Deskripsi</label>
      <textarea name="deskripsi" id="deskripsi" placeholder="Masukkan deskripsi barang yang ditemukan"
        required></textarea>

      <label for="tanggal">Terakhir Ditemukan</label>

      <input type="text" name="tempat" id="tempat" placeholder="Masukkan tempat terakhir ditemukan" required>
      <input type="date" name="tanggal" id="tanggal" placeholder="Masukkan tanggal terakhir ditemukan" required>

      <label for="notelp">Nomor Telepon</label>
      <input type="text" name="notelp" id="notelp" placeholder="Masukkan nomor telepon Anda" required>

      <label for="gambar">Gambar</label>
      <input type="file" name="gambar" id="gambar" accept="image/*">
      <label for="gambar" class="border_kotak">
        <span>+</span>
      </label>

      <!-- ini buat preview gambar pake javascript, nanti kalo udah di klik tombol + bakal muncul preview gambarnya di bawah tombol + -->
      <div id="preview-container" class="preview-container hidden">
        <img id="image-preview" src="" alt="Preview Gambar" />
        <button type="button" id="btn-remove" class="btn-remove" title="Hapus Gambar">x</button>
      </div>

      <input type="submit" value="KIRIM">
    </form>
  </div>

  <script src="form.js"></script>
